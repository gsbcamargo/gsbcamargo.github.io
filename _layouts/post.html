---
layout: default
---

<article class="article">
  <a class="back-link" href="{{ '/' | relative_url }}">← All writing</a>

  <header class="article-header">
    <p class="eyebrow">{{ page.date | date: "%d %b %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="article-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="article-body">
    {{ content }}
  </div>
</article>
