<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}
  </title>
  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <script>
    try {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">~/</span> gabriel schreiner
      </a>

      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Principal</a>
        <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
        <a href="https://github.com/gsbcamargo">GitHub ↗</a>
        <button id="theme-toggle" type="button"
                aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{ 'now' | date: '%Y' }} Gabriel Schreiner
        <p>OAB/PR n.° 79.359 | OAB/SC n.º 79.057-A</p>
      </span>
      <span>Written to be read.</span>
    </div>
  </footer>
</body>
</html>
